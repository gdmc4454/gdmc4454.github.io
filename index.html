<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김태현의 여행 기록 | 유후인, 파리, 산티아고, 바르셀로나</title>

<style>
  :root {
    --sea: #12355b;
    --sea-deep: #0b2340;
    --arrow: #f2b705;
    --paper: #f6f8fa;
    --stone: #55606d;
    --line: #d5dce3;
    --white: #ffffff;
    --serif: "Gowun Batang", "Noto Serif KR", serif;
    --sans: "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    color: #1c2530;
    background: var(--paper);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--arrow); outline-offset: 3px; }

  nav {
    position: sticky; top: 0; z-index: 10;
    background: rgba(11, 35, 64, .96);
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    padding: 10px 12px;
  }
  nav a {
    color: #dfe7f0; text-decoration: none; font-size: .95rem;
    padding: 6px 14px; border-radius: 999px;
  }
  nav a:hover { background: rgba(255,255,255,.12); }

  .hero {
    background: var(--sea-deep);
    color: var(--white);
    padding: 96px 24px 88px;
    position: relative;
    overflow: hidden;
  }
  .hero-inner { max-width: 880px; margin: 0 auto; position: relative; z-index: 1; }
  .hero p.who { color: var(--arrow); font-size: 1.05rem; margin-bottom: 18px; }
  .hero h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(2.6rem, 9vw, 5.6rem);
    line-height: 1.15;
    letter-spacing: -0.01em;
  }
  .hero .lead {
    margin-top: 28px; max-width: 34em;
    font-size: 1.1rem; color: #cfdae8;
  }
  .hero svg.trail {
    position: absolute; right: -40px; bottom: -10px;
    width: min(620px, 90vw); opacity: .9; z-index: 0;
  }

  main { max-width: 880px; margin: 0 auto; padding: 0 24px; }
  section { padding: 72px 0 24px; }
  h2 {
    font-family: var(--serif);
    font-size: clamp(1.8rem, 5vw, 2.5rem);
    line-height: 1.3;
    color: var(--sea);
    margin-bottom: 14px;
  }
  h3 { font-family: var(--serif); font-size: 1.35rem; color: var(--sea); margin-bottom: 6px; }
  p + p { margin-top: 1em; }
  .intro { color: var(--stone); max-width: 38em; margin-bottom: 36px; }

  .places { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .place {
    background: var(--white);
    border-left: 6px solid var(--line);
    padding: 22px 22px 24px;
  }
  .place.main { border-left-color: var(--arrow); }
  .place .meta { color: var(--stone); font-size: .92rem; margin-bottom: 10px; }

  .route { list-style: none; position: relative; margin: 32px 0 8px; padding-left: 38px; }
  .route::before {
    content: ""; position: absolute; left: 11px; top: 8px; bottom: 8px;
    border-left: 3px dashed var(--arrow);
  }
  .route li { position: relative; padding-bottom: 34px; }
  .route li:last-child { padding-bottom: 0; }
  .route li::before {
    content: ""; position: absolute; left: -35px; top: 7px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--sea); border: 3px solid var(--paper);
    box-shadow: 0 0 0 2px var(--sea);
  }
  .route li.walk::before { background: var(--arrow); box-shadow: 0 0 0 2px var(--arrow); }

  .photo-slot {
    margin-top: 16px;
    aspect-ratio: 16 / 9;
    background: #e4eaf0;
    display: grid; place-items: center;
    color: var(--stone); font-size: .9rem; text-align: center; padding: 0;
    overflow: hidden;
  }
  .photo-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .photo-pair {
    display: grid; gap: 16px; margin-top: 16px;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  }
  .photo-pair .photo-slot { margin-top: 0; }

    position: relative; aspect-ratio: 16 / 9; margin-top: 16px;
    background: #000;
